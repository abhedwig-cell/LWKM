name: W09 MET08 source-corrected Windows x64
on:
  push:
    branches:
      - work/w09-met03-native-windows-20261027
      - work/w09-met08-source-fix-20261117
    paths:
      - 'tools/native/w09_met05/**'
      - 'tools/native/w09_common/**'
      - 'tools/native/w09/**'
      - '.github/workflows/w09-met05-windows-x64.yml'
  pull_request:
    paths:
      - 'tools/native/w09_met05/**'
      - 'tools/native/w09_common/**'
      - 'tools/native/w09/**'
      - '.github/workflows/w09-met05-windows-x64.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile both corrected producers with MSVC
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /O2 /fp:strict /MT /DNDEBUG /Fe:w09_direct_met.exe tools\native\w09_met05\src\w09_direct_met.cpp
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /fp:strict /MT /DNDEBUG /Fe:lwkm_w09_meteo.exe tools\native\w09\w09.cpp
          if errorlevel 1 exit /b 1
      - name: Test actual Windows executables
        shell: pwsh
        run: |
          python tools/native/w09_met05/tests/test_hum_contract.py ./w09_direct_met.exe ./lwkm_w09_meteo.exe 2>&1 | Tee-Object MET08_TESTLOG.txt
          if ($LASTEXITCODE -ne 0) { throw "MET08 HUM regressions failed" }
          (Get-FileHash ./w09_direct_met.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii w09_direct_met.sha256
          (Get-FileHash ./lwkm_w09_meteo.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii lwkm_w09_meteo.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LWKM_W09_MET08_Windows_x64
          path: |
            w09_direct_met.exe
            w09_direct_met.sha256
            lwkm_w09_meteo.exe
            lwkm_w09_meteo.sha256
            MET08_TESTLOG.txt
            tools/native/w09_met05
            tools/native/w09_common
            tools/native/w09
          if-no-files-found: error
