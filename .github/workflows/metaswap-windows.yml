name: MetaSWAP Windows binary qualification
on:
  pull_request:
    paths:
      - 'tools/metaswap_hru/**'
      - '.github/workflows/metaswap-windows.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Restore source-bound SVAT fields
        run: python tools/metaswap_hru/tests/restore_supplied.py tools/metaswap_hru/tests/supplied_members.csv.gz test-inputs
      - name: Compile changed C++ source on native Windows x64
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /O2 /MT /Fe:tools\metaswap_hru\lwkm_metaswap_hru.exe tools\metaswap_hru\lwkm_metaswap_hru.cpp bcrypt.lib
      - name: Execute newly compiled Windows EXE and verify every HRU
        run: python tools/metaswap_hru/tests/test_windows.py tools/metaswap_hru/lwkm_metaswap_hru.exe test-work test-inputs/area.inp test-inputs/mapping.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metaswap-windows-qualification
          path: |
            test-work/test_results.json
            test-work/small/out/*
            test-work/full/out/*
            tools/metaswap_hru/lwkm_metaswap_hru.exe
          retention-days: 30
