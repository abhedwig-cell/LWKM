name: LWKM canonical unit tests
on:
  pull_request:
  push:
    branches:
      - work/lhm-hru-swap-workflow-v1
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements-lhm-hru-swap.txt pytest
      - run: pytest -q tests
