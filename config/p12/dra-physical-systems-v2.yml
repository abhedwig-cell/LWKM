swap_interface:
  maximum_levels: 5
  authority:
    supplied_hrulist_source_comment: NRLEVS_1_TO_5
    supplied_hrulist_active_value: 5
  compression_rule:
    preserve_all_seven_before_interface: true
    pipe_merge_allowed: false
    cross_hydraulic_class_merge_allowed: false
    open_channel_merge_only_when_active_count_exceeds_available_slots: true
    selection: minimum_conductance_weighted_level_variance
    sequence:
      - aggregate_all_seven_physical_systems
      - preserve_all_positive_conductance_systems
      - compress_only_if_more_than_five_active
      - apply_modern_swap_interface_validation_after_compression
      - render_explicit_levels
    merge_conservation:
      drainage_conductance: exact_parallel_sum
      infiltration_conductance: exact_parallel_sum_within_compatible_class
      bottom_depth: drainage_conductance_weighted
      level_time_series: drainage_conductance_weighted_per_timestamp
      spacing_L: preserve_common_representative_svat_dqsat_times_4
    dynamic_level_policy:
      H1: preserve_monthly_peilh_series
      seasonal_open_channels: evaluate_seasonal_level_at_dynamic_timestamps_when_merged
      explicit_date_mismatch: FAIL_CLOSED
    merge_equivalence_diagnostic:
      conductance_conservation_alone_is_sufficient_for_admission: false
      drainage_infiltration_centroid_gap:
        metric: max_drainage_infiltration_level_gap_m
        meaning: absolute_gap_between_drainage_weighted_and_infiltration_weighted_equivalent_levels
        unit: m
        applies_to: infiltration_capable_merged_levels
        acceptance_threshold: UNSET_PENDING_10242_POPULATION_EVIDENCE
      source_activation_level_span:
        metric: max_source_level_separation_m
        meaning: maximum_separation_between_physical_prescribed_levels_collapsed_into_one_SWAP_level
        unit: m
        applies_to: all_merged_levels
        exact_equivalence_implication: nonzero_span_means_two_activation_breakpoints_are_collapsed
        acceptance_threshold: UNSET_PENDING_10242_POPULATION_EVIDENCE
      bottom_depth_span:
        metric: bottom_depth_separation_m
        meaning: absolute_source_drainage_bottom_depth_separation_collapsed_into_equivalent_bottom
        unit: m
        applies_to: all_merged_levels
        acceptance_threshold: UNSET_PENDING_10242_POPULATION_EVIDENCE
      required_population_reporting:
        - drainage_infiltration_gap_p50_p90_p95_p99_max
        - source_activation_level_span_p50_p90_p95_p99_max
        - H1_source_activation_level_span_p50_p90_p95_p99_max
        - bottom_depth_span_p50_p90_p95_p99_max
        - events_with_positive_centroid_gap
        - events_with_positive_source_level_span
    status: IMPLEMENTED_NOT_10242_ADMITTED

