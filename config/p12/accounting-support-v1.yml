schema_version: 1
contract: P12_ACCOUNTING_SUPPORT_V1
reference_areas:
  modflow_cell_m2: 62500
quantities:
  qq_vertical:
    source_support: MODFLOW_CELL
    source_kind: intensive
    source_unit: m_per_day
    derivation: "(head_l2 - head_l1) / c1"
    target_support: HRU_MODFLOW_CELLS
    historical_aggregation: equal_mean_over_selected_cells
    candidate_status: source_semantics_confirmed_realized_executable_uses_donor_equal_or_equivalent
    uopp_weighting: forbidden_without_explicit_target_change
  precipitation:
    source_support: METEO_RASTER_AT_SVAT
    source_kind: intensive
    target_support: HRU_METASWAP_ACTIVE_AREA
    aggregation: "sum(value * uopp_member) / sum(uopp_member)"
    status: confirmed_historical_formula_uopp_weighted
  evaporation:
    source_support: METEO_RASTER_AT_SVAT
    source_kind: intensive
    target_support: HRU_METASWAP_ACTIVE_AREA
    aggregation: "sum(value * uopp_member) / sum(uopp_member)"
    status: confirmed_historical_formula_uopp_weighted
  flf:
    source_support: MODFLOW_CELL
    source_kind: extensive_budget_candidate
    target_support: UNRESOLVED
    historical_aggregation: "100 * sum(value) / sum(uopp_member)"
    status: UNRESOLVED_SUPPORT_CONVERSION
    canonical_storage: [volume_or_native_sum, modflow_area_m2, metaswap_active_area_m2]
  qlat:
    source_support: MIXED_DERIVED_COUPLING
    source_kind: derived_balance
    target_support: HRU_METASWAP_ACTIVE_AREA
    historical_aggregation: "100 * sum(value) / sum(uopp_member)"
    status: historical_alternative_and_diagnostic_pending
rules:
  - "1 MODFLOW cell maps to 1 MetaSWAP SVAT in source LHM coupling."
  - "uopp may be less than 62500 m2."
  - "Do not require MetaSWAP surface balance to close the complete MODFLOW-cell surface balance."
  - "Do not apply uopp weighting to MODFLOW-cell intensities unless target support is intentionally changed."
  - "Every conversion must name source and target support."
  drainage_resistance:
    source_support: MODFLOW_CELL
    source_kind: parallel_conductance
    source_unit: m2_per_day
    target_support: HRU_MODFLOW_CELLS
    aggregation: "(62500 * n_members) / sum(conductance)"
    target_unit: day
    status: CONFIRMED_CORRECT
    uopp_weighting: forbidden
  drainage_depth:
    source_support: MODFLOW_CELL
    source_kind: conductance_weighted_depth
    target_support: HRU_EQUIVALENT_DRAIN
    aggregation: "sum(conductance * depth) / sum(conductance)"
    status: CONFIRMED_CORRECT
